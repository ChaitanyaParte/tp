<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Women Safety Analytics</title>
  <meta name="description" content="Sign in to Women Safety Analytics — Real-time intelligence for safer communities." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" />
  <style>
    /* ── Theme tokens ── */
    :root {
      --primary:        #6C4CE8;
      --primary-dark:   #4B32A8;
      --primary-light:  #F0ECFF;
      --bg:             #F8F9FC;
      --white:          #FFFFFF;
      --text:           #171923;
      --text-secondary: #6B7280;
      --border:         #E5E7EB;
      --input-bg:       #FFFFFF;
      --card-bg:        #FFFFFF;
      --shadow:         0 4px 24px rgba(0,0,0,.08);
    }
    [data-theme="dark"] {
      --bg:             #0F0E17;
      --white:          #1A1928;
      --text:           #F1F0FF;
      --text-secondary: #9CA3AF;
      --border:         #2D2B40;
      --input-bg:       #221F35;
      --card-bg:        #1A1928;
      --shadow:         0 4px 32px rgba(0,0,0,.35);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      transition: background .25s, color .25s;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Top-right toggle ── */
    .top-bar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 54px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      z-index: 10;
    }
    .top-brand {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text);
    }
    .top-brand-icon {
      width: 30px; height: 30px;
      background: var(--primary);
      border-radius: 7px;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
    }

    .theme-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 99px;
      padding: 5px 12px 5px 8px;
      cursor: pointer;
      transition: all .2s;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-secondary);
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
    }
    .theme-toggle:hover { border-color: var(--primary); color: var(--primary); }
    .theme-toggle .icon { font-size: 15px; line-height: 1; }

    /* ── Login card ── */
    .login-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
      width: 100%;
      max-width: 420px;
      padding: 40px 36px 36px;
      transition: background .25s, border-color .25s;
    }

    /* Brand inside card */
    .card-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
    }
    .card-brand-icon {
      width: 38px; height: 38px;
      background: var(--primary);
      border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; flex-shrink: 0;
    }
    .card-brand-text { font-size: 14px; font-weight: 700; color: var(--text); line-height: 1.3; }

    .card-title { font-size: 22px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
    .card-sub   { font-size: 13.5px; color: var(--text-secondary); margin-bottom: 28px; }

    /* Form elements */
    .form-group { margin-bottom: 16px; }
    .form-label {
      display: block;
      font-size: 13px; font-weight: 600;
      color: var(--text);
      margin-bottom: 6px;
    }
    .input-wrap { position: relative; }
    .form-input {
      width: 100%;
      padding: 10px 12px 10px 38px;
      border: 1px solid var(--border);
      border-radius: 9px;
      font-size: 13.5px;
      font-family: inherit;
      color: var(--text);
      background: var(--input-bg);
      outline: none;
      transition: border-color .15s, box-shadow .15s, background .25s;
    }
    .form-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(108,76,232,.12);
    }
    .form-input::placeholder { color: #9CA3AF; }
    .input-icon {
      position: absolute; left: 11px; top: 50%;
      transform: translateY(-50%);
      color: #9CA3AF;
      display: flex;
    }
    .input-icon svg { width: 16px; height: 16px; stroke: currentColor; stroke-width: 1.8; fill: none; }
    .pass-toggle {
      position: absolute; right: 11px; top: 50%;
      transform: translateY(-50%);
      background: none; border: none; cursor: pointer;
      color: #9CA3AF; display: flex; padding: 2px;
    }
    .pass-toggle:hover { color: var(--text-secondary); }
    .pass-toggle svg { width: 16px; height: 16px; stroke: currentColor; stroke-width: 1.8; fill: none; }

    .form-between {
      display: flex; align-items: center;
      justify-content: space-between;
      margin-bottom: 22px;
    }
    .form-check { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--text-secondary); cursor: pointer; }
    .form-check input { accent-color: var(--primary); width: 14px; height: 14px; }
    .forgot-link { font-size: 13px; color: var(--primary); font-weight: 500; cursor: pointer; background: none; border: none; font-family: inherit; }
    .forgot-link:hover { text-decoration: underline; }

    /* Buttons */
    .btn-login {
      width: 100%;
      padding: 11px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 9px;
      font-size: 14px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: background .15s, transform .1s;
    }
    .btn-login:hover { background: #5A3DD4; }
    .btn-login:active { transform: scale(.99); }
    .btn-login svg { width: 16px; height: 16px; stroke: currentColor; stroke-width: 2; fill: none; }
    .btn-login:disabled { opacity: .7; cursor: not-allowed; }

    .divider { display: flex; align-items: center; gap: 12px; margin: 18px 0; color: #9CA3AF; font-size: 12px; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }

    .btn-sso {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--input-bg);
      font-size: 13.5px;
      font-weight: 500;
      color: var(--text);
      font-family: inherit;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: background .15s, border-color .15s;
    }
    .btn-sso:hover { background: var(--bg); border-color: var(--primary); }

    .card-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 12px;
      color: var(--text-secondary);
    }

    /* Spin */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner { animation: spin .8s linear infinite; }
  </style>
</head>
<body>

  <!-- Top bar: branding + theme toggle -->
  <div class="top-bar">
    <div class="top-brand">
      <div class="top-brand-icon">🛡️</div>
      Women Safety Analytics
    </div>
    <button class="theme-toggle" id="theme-btn" onclick="toggleTheme()" title="Toggle light / dark mode">
      <span class="icon" id="theme-icon">🌙</span>
      <span id="theme-label">Dark mode</span>
    </button>
  </div>

  <!-- Login card -->
  <div class="login-card">
    <div class="card-brand">
      <div class="card-brand-icon">🛡️</div>
      <div class="card-brand-text">Women Safety Analytics<br><span style="font-weight:400;font-size:12px;color:var(--text-secondary);">Powered by SafeCity Initiative</span></div>
    </div>

    <h1 class="card-title">Welcome back</h1>
    <p class="card-sub">Sign in to your account to continue.</p>

    <form id="login-form" onsubmit="handleLogin(event)" autocomplete="on">

      <!-- Email -->
      <div class="form-group">
        <label class="form-label" for="email">Email address</label>
        <div class="input-wrap">
          <span class="input-icon">
            <svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          </span>
          <input class="form-input" type="email" id="email" name="email"
            placeholder="admin@safecity.gov.in"
            value="admin@safecity.gov.in" required autocomplete="username" />
        </div>
      </div>

      <!-- Password -->
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <div class="input-wrap">
          <span class="input-icon">
            <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          </span>
          <input class="form-input" type="password" id="password" name="password"
            placeholder="Enter your password"
            value="Admin@1234" required autocomplete="current-password"
            style="padding-right:40px;" />
          <button type="button" class="pass-toggle" onclick="togglePass()" title="Show / hide password">
            <svg id="eye-icon" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>

      <!-- Remember + Forgot -->
      <div class="form-between">
        <label class="form-check">
          <input type="checkbox" checked /> Remember me
        </label>
        <button type="button" class="forgot-link">Forgot password?</button>
      </div>

      <!-- Sign In -->
      <button type="submit" class="btn-login" id="login-btn">
        <svg viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
        Sign In
      </button>

      <div class="divider">or</div>

      <!-- SSO -->
      <button type="button" class="btn-sso">
        <svg width="16" height="16" viewBox="0 0 48 48">
          <path fill="#4285F4" d="M46.6 24.5c0-1.6-.1-3.1-.4-4.6H24v8.7h12.7c-.6 3-2.3 5.5-4.9 7.2v6h7.9c4.6-4.2 7.3-10.5 7.3-17.3z"/>
          <path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.8-5.8l-7.9-6c-2.1 1.4-4.8 2.3-7.9 2.3-6.1 0-11.2-4.1-13.1-9.6H2.7v6.2C6.6 42.9 14.7 48 24 48z"/>
          <path fill="#FBBC05" d="M10.9 28.9c-.5-1.4-.7-2.9-.7-4.4s.3-3 .7-4.4V13.9H2.7C1 17.3 0 21.1 0 25.1c0 4 1 7.8 2.7 11.2l8.2-7.4z"/>
          <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.5l6.8-6.8C35.8 2.4 30.4 0 24 0 14.7 0 6.6 5.1 2.7 12.9l8.2 6.2C12.8 13.6 17.9 9.5 24 9.5z"/>
        </svg>
        Sign in with Government SSO
      </button>
    </form>

    <div class="card-footer">
      &copy; 2025 SafeCity Initiative &middot; Smart India Hackathon
    </div>
  </div>

<script>
  /* ── Dark / Light toggle ── */
  const savedTheme = localStorage.getItem('wsa-theme') || 'light';
  applyTheme(savedTheme);

  function toggleTheme() {
    const current = document.documentElement.getAttribute('data-theme');
    applyTheme(current === 'dark' ? 'light' : 'dark');
  }

  function applyTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    localStorage.setItem('wsa-theme', t);
    const icon  = document.getElementById('theme-icon');
    const label = document.getElementById('theme-label');
    if (icon && label) {
      icon.textContent  = t === 'dark' ? '☀️' : '🌙';
      label.textContent = t === 'dark' ? 'Light mode' : 'Dark mode';
    }
  }

  /* ── Password visibility ── */
  function togglePass() {
    const p = document.getElementById('password');
    p.type = p.type === 'password' ? 'text' : 'password';
  }

  /* ── Login submit ── */
  function handleLogin(e) {
    e.preventDefault();
    const btn = document.getElementById('login-btn');
    btn.disabled = true;
    btn.innerHTML = `
      <svg class="spinner" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0z" opacity=".25"/>
        <path d="M21 12a9 9 0 0 1-9 9"/>
      </svg>
      Signing in…`;
    setTimeout(() => { window.location.href = 'dashboard.html'; }, 1200);
  }
</script>
</body>
</html>
